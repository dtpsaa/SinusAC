# =============================================
# SinusAC AntiCheat - messages.yml
# =============================================

prefix: "&8[&bSinusAI&8] "

# ====================== Основные сообщения ======================
no-permission: "{prefix}&cУ вас недостаточно прав для этой команды."
plugin-not-ready: "{prefix}&cПлагин не готов — нет подключения к ML-серверу."
players-only: "{prefix}&cЭта команда доступна только игрокам."
player-not-found: "{prefix}&cИгрок &e{player} &cне найден на сервере."

# ====================== Команда /sinusac ======================
cmd:
  # Справка — списком (getList)
  help:
    - "&8&m                    "
    - " &bSinusAC &7— Справка"
    - "&8&m                    "
    - " &7/sinusac status &8— Статус API, лицензии и сессий"
    - " &7/sinusac alerts <on|off> &8— Уведомления в чат (глобально)"
    - " &7/sinusac holo <on|off> &8— Голограммы (лично для вас)"
    - " &7/sinusac check <игрок> &8— Принудительный анализ"
    - " &7/sinusac sessions &8— Список активных сессий"
    - " &7/sinusac reload &8— Перезагрузить конфиг"
    - "&8&m                    "

  # Status
  status:
    api: "{prefix}&7API-сервер: &f{url}"
    sessions: "{prefix}&7Активных сессий: &e{count}"
    alerts: "{prefix}&7Уведомления: &f{state}"
    api_check: "{prefix}&7Статус ML-сервера: &f{status}"
    license: "{prefix}&7Лицензия: {valid}{msg} &7(осталось: &a{days}&7)"

  # Reload
  reload:
    start: "{prefix}&7Перезагрузка конфигурации..."
    success: "{prefix}&aКонфиг успешно перезагружен."
    fail: "{prefix}&cОшибка перезагрузки: &e{msg}"

  # Check
  check:
    usage: "{prefix}&cИспользование: &7/sinusac check <игрок>"
    analyzing: "{prefix}&7Начинаю принудительный анализ игрока &e{player}&7..."

  # Holo (локальный тумблер — действует только на написавшего)
  holo:
    usage: "{prefix}&7Голограммы у вас сейчас: &f{state}&7. Использование: &7/sinusac holo <on|off>"
    usage_err: "{prefix}&cИспользуй &eon &cили &eoff&c."
    "on": "{prefix}&aГолограммы включены &7(только для вас)&a."
    "off": "{prefix}&cГолограммы отключены &7(только для вас)&c."

  # Alerts (глобальный тумблер)
  alerts:
    usage: "{prefix}&7Уведомления сейчас: &f{state}&7. Использование: &7/sinusac alerts <on|off>"
    usage_err: "{prefix}&cИспользуй &eon &cили &eoff&c."
    "on": "{prefix}&aУведомления включены."
    "off": "{prefix}&cУведомления отключены."

  # Sessions
  sessions:
    count: "{prefix}&7Активных сессий: &e{count}"

# ====================== Уведомления (actions) ======================
notify:
  message: "&8[&bSinusAI&8] &f{player} &7— &f{verdict} &fшанс читерства: &c{prob}% &8(&b{vl}&7/&b{max_vl}&8)"
