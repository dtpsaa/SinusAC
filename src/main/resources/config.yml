# =============================================
# SinusAC AntiCheat - config.yml
# Лицензионный ключ: t.me/sinusai
# =============================================
license-key: ""

server:
  url: "https://sinusai.tech"
  # Анализ ударов в отдельном потоке (рекомендуется true)
  async: true

collection:
  # Минимум фреймов для анализа/выгрузки
  min-frames: 60
  # Максимум фреймов в скользящем окне сессии
  max-frames: 300
  combat-timeout-ticks: 20
  send-on-combat-end: false
  # Порог VL для наказания
  max-vl: 5
  # Команды наказания (указывайте свою)
  punish-commands:
    - "ban {player}"

checks:
  combat:
    enabled: true
    # 0.00 = алертить каждый проверенный удар (чистые алерты)
    alert-threshold: 0.00
    # Порог накопления VL (+1)
    notify-threshold: 0.80
    # Порог мгновенного авто-наказания
    auto-flag-threshold: 0.99

actions:
  notify:
    message: "&8[&bSinusAI&8] &f{player} &7- &f{verdict} &fшанс что с читом: &c{prob}% &8(&b{vl}&7/&b{max_vl}&8)"
