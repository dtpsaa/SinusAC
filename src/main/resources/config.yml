
locale: "en"

license-key: ""

server:
  url: "https://sinusai.tech"

collection:
  min-frames: 60
  max-frames: 300
  combat-timeout-ticks: 20
  send-on-combat-end: false
  max-vl: 5
  punish-commands:
    - "ban {player}"

checks:
  combat:
    enabled: true
    request-interval-ticks: 20
    alert-threshold: 0.00
    notify-threshold: 0.80
    auto-flag-threshold: 0.99

  fly:
    enabled: true
    bedrock-only: true
    batch-size: 20
    min-vl: 3
    max-mvl: 12
    setback: true
    punish-commands: []
